name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev + ui + baselines)
        run: pip install -e ".[dev,ui,baselines]"

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          # GHA Python 3.11 images ship setuptools 79.x with a known advisory;
          # upgrade before audit so pip-audit reflects what we actually need.
          pip install -U "setuptools>=83"
          pip install pip-audit
          pip-audit

      - name: LabRF NiceGUI build_ui smoke
        run: python -c "from labrf.ui_app import build_ui; build_ui()"

      - name: Run pytest
        run: pytest -q
