[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemspec-workbench"
version = "0.1.0"
description = "Software-only UV-Vis / IR spectrum workbench (honest peaks, baseline, overlay)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JARTH / Spectrum Family" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jcamp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
ui = [
    "nicegui>=1.4",
    "plotly>=5.18",
]

[project.scripts]
chemspec-demo = "chemspec.demo:main"
chemspec-ui = "chemspec.ui_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spectrum_core*", "chemspec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
