[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemspec-workbench"
version = "0.1.0"
description = "Software-only UV-Vis / IR spectrum workbench + LabRF Monitor + TeachSpec stub (Spectrum Family)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JARTH / Spectrum Family" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jcamp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pybaselines>=1.0",
]
ui = [
    "nicegui>=1.4",
    "plotly>=5.18",
]
baselines = [
    "pybaselines>=1.0",
]
labrf = [
    "pyrtlsdr>=0.3.0",
]
rtlsdr = [
    "pyrtlsdr>=0.3.0",
]

[project.scripts]
chemspec-demo = "chemspec.demo:main"
chemspec-ui = "chemspec.ui_app:main"
labrf-ui = "labrf.ui_app:main"
teachspec-demo = "teachspec.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spectrum_core*", "chemspec*", "labrf*", "teachspec*"]

[tool.setuptools.package-data]
labrf = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
